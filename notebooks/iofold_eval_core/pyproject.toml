[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iofold-eval-core"
version = "0.1.0"
description = "Platform-agnostic eval generation from labeled traces"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "iofold", email = "dev@iofold.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
# OpenAI SDK only - use Cloudflare AI Gateway for other providers
llm = [
    "openai>=1.0.0",
]
embeddings = [
    "openai>=1.0.0",
]
notebooks = [
    "marimo>=0.18.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]
all = [
    "iofold-eval-core[llm,embeddings,notebooks]",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["iofold_eval_core"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py310"
